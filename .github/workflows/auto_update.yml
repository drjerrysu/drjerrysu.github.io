name: Auto Update Stock Data

on:
  schedule:
    # 每週一至週五，台灣時間 18:00 執行
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-stock-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 簽出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: 執行爬蟲抓取真實台股資料
        run: python -u update_stock.py

      - name: 檢查資料檔案
        run: |
          python -c "import json; d=json.load(open('stock_data.json', encoding='utf-8')); assert isinstance(d.get('data'), list) and len(d['data']) > 0, '股票資料為空'; print('資料日期:', d.get('date')); print('股票筆數:', len(d['data']))"

      - name: 自動提交並推送到 GitHub
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add stock_data.json

          if git diff --cached --quiet; then
            echo "資料沒有變更，不需要提交。"
          else
            git commit -m "Auto-update real stock data [skip ci]"
            git push
          fi
