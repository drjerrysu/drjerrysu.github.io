name: Update institutional data
on:
  workflow_dispatch:
  schedule:
    # 18:35 Taiwan time (UTC+8) on weekdays. Scheduled runs may be delayed.
    - cron: "35 10 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Fetch official data
        run: python update_institutional.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/institutional_data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update official institutional data"
            git push
          fi
