<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股三大法人買賣超智慧篩選系統</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }
        .header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.75rem; font-weight: bold; color: #38bdf8; margin: 0 0 8px 0; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        input, select { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; color: #f8fafc; font-size: 0.875rem; }
        .btn { background-color: #0284c7; color: white; font-weight: bold; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #0ea5e9; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: #38bdf8; font-weight: 600; }
        .text-red { color: #f43f5e; font-weight: bold; } /* 台股紅：買超 */
        .text-green { color: #34d399; font-weight: bold; } /* 台股綠：賣超 */
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .update-time { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 8px 16px; border-radius: 8px; font-size: 0.8125rem; color: #38bdf8; display: inline-block; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>📈 台股三大法人買賣超智慧篩選儀表板</h1>
            <p style="font-size: 0.875rem; color: #94a3b8; margin: 0;">自動過濾三大法人買超與賣超標的，並顯示外資、投信、自營商個別動向</p>
            <div id="data-time-badge" class="update-time">⏳ 正在取得資料時間...</div>
        </header>

        <div class="card">
            <div class="controls">
                <div>
                    <label style="font-size: 0.8125rem; color: #94a3b8; margin-right: 8px;">篩選條件：</label>
                    <select id="filter-type" onchange="renderTable()">
                        <option value="net-buy">三大法人合計：淨買超 (> 0)</option>
                        <option value="net-sell">三大法人合計：淨賣超 (< 0)</option>
                        <option value="foreign-buy">僅看外資買超</option>
                        <option value="trust-buy">僅看投信買超</option>
                        <option value="all">顯示全部清單</option>
                    </select>
                </div>
                <div>
                    <input type="text" id="search-input" placeholder="輸入代號或名稱搜尋..." onkeyup="renderTable()">
                    <button class="btn" onclick="loadStockData()">🔄 重新載入數據</button>
                </div>
            </div>

            <div id="table-container">
                <table id="stock-table">
                    <thead>
                        <tr>
                            <th>股票代號/名稱</th>
                            <th>收盤價</th>
                            <th>外資買賣超</th>
                            <th>投信買賣超</th>
                            <th>自營商買賣超</th>
                            <th>三大法人合計</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="6" class="loading">正在載入法人買賣超數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 模擬台股三大法人買賣超數據（包含正數買超與負數賣超）
        let stockData = [
            { code: "2330", name: "台積電", price: "1080", foreign: 12540, trust: 3200, self: -450 },
            { code: "2317", name: "鴻海", price: "215", foreign: -3200, trust: 1500, self: 200 },
            { code: "2454", name: "聯發科", price: "1350", foreign: 4100, trust: 890, self: 310 },
            { code: "2603", name: "長榮", price: "205", foreign: -3500, trust: -1200, self: -850 },
            { code: "2881", name: "富邦金", price: "92.5", foreign: 5600, trust: 1200, self: 850 },
            { code: "2308", name: "台達電", price: "395", foreign: 2300, trust: 1800, self: -120 },
            { code: "3037", name: "欣興", price: "165", foreign: -850, trust: 300, self: -50 },
            { code: "2891", name: "中信金", price: "37.2", foreign: 8900, trust: 2100, self: 1400 },
            { code: "2382", name: "廣達", price: "290", foreign: -1400, trust: -200, self: -400 },
            { code: "2609", name: "陽明", price: "72", foreign: -2500, trust: -800, self: -380 }
        ];

        function formatNum(num) {
            const formatted = Math.abs(num).toLocaleString();
            // 在台股慣例中：紅色代表買超(正)，綠色代表賣超(負)
            const cls = num > 0 ? 'text-red' : (num < 0 ? 'text-green' : '');
            const sign = num > 0 ? '+' : (num < 0 ? '-' : '');
            return `<span class="${cls}">${sign}${formatted} 張</span>`;
        }

        function updateDataTimeDisplay() {
            const badge = document.getElementById('data-time-badge');
            const now = new Date();
            // 模擬台股資料抓取時間（若當天為假日或收盤前，則顯示最近一個交易日收盤結算時間）
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            badge.innerHTML = `📅 資料統計日期：${year}-${month}-${day} (證交所三大法人收盤結算資料)`;
        }

        function loadStockData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="loading">正在向交易所更新三大法人資料...</td></tr>`;
            
            setTimeout(() => {
                updateDataTimeDisplay();
                renderTable();
            }, 500);
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const filterType = document.getElementById('filter-type').value;
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            let filtered = stockData.map(item => {
                const total = item.foreign + item.trust + item.self;
                return { ...item, total };
            });

            // 搜尋過濾
            if (searchKeyword) {
                filtered = filtered.filter(item => 
                    item.code.toLowerCase().includes(searchKeyword) || 
                    item.name.toLowerCase().includes(searchKeyword)
                );
            }

            // 條件篩選
            if (filterType === 'net-buy') {
                filtered = filtered.filter(item => item.total > 0);
            } else if (filterType === 'net-sell') {
                filtered = filtered.filter(item => item.total < 0);
            } else if (filterType === 'foreign-buy') {
                filtered = filtered.filter(item => item.foreign > 0);
            } else if (filterType === 'trust-buy') {
                filtered = filtered.filter(item => item.trust > 0);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading">找不到符合條件的股票資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.code}</strong> ${item.name}</td>
                    <td>$${item.price}</td>
                    <td>${formatNum(item.foreign)}</td>
                    <td>${formatNum(item.trust)}</td>
                    <td>${formatNum(item.self)}</td>
                    <td><strong>${formatNum(item.total)}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初始化
        window.onload = () => {
            updateDataTimeDisplay();
            renderTable();
        };
    </script>
</body>
</html>
